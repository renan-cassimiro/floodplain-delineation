[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "floodplain-delineation"
version = "0.2.0"
description = "Preliminary potentially inundatable floodplain delineation from a DEM (HAND threshold)"
requires-python = ">=3.9"
dependencies = ["numpy", "rasterio", "geopandas", "shapely>=2.0", "pyproj", "pyyaml", "whitebox"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
floodplain-delineation = "floodplain_delineation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["wbt: integration test that requires the WhiteboxTools executable"]
