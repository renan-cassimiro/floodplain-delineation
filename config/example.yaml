# Example configuration (illustrative values only -- NOT calibrated for any basin).
# Relative paths are resolved against the current working directory.
project:
  name: "potential_floodplain_delineation"

inputs:
  dem: "data/input/xingu_river/xingu_river_fathomdem_30m_cog.tif"                 # single-band elevation raster with CRS and nodata
  pilot_area: "data/input/xingu_river/xingu_river_study_area_bounding_box.gpkg"  # polygon layer(s); multiple polygons are dissolved
  pilot_layer: xingu_river_study_area_bounding_box                   # optional GPKG layer name
  vertical_units: "meters"            # vertical unit of the DEM (documentation + HAND threshold unit)

processing:
  buffer_distance: 5000               # context buffer around the pilot area
  buffer_units: "meters"              # "meters" or "cells"
  conditioning:
    method: "breach"                  # "breach" (BreachDepressions) or "fill" (FillDepressionsWangAndLiu)
  flow:
    algorithm: "d8"                   # only D8 is supported
  drainage:
    threshold_type: "area_km2"        # "cells" or "area_km2"
    threshold_value: 100              # minimum contributing cells or km2 to define drainage
  hand:
    threshold: 7.5                      # same vertical unit as the DEM

outputs:
  directory: "outputs"
  intermediates: "intermediate"
  final: "final"
  save_conditioned_dem: true
  save_flow_direction: true
  save_flow_accumulation: true
  save_drainage_network: true
  save_hand: true

execution:
  overwrite: false
  verbose: true
  # whitebox_executable: "/path/to/whitebox_tools"   # optional; auto-detected otherwise
