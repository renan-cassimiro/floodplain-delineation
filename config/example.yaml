# Example configuration (illustrative values only -- NOT calibrated for any basin).
# Relative paths are resolved against the current working directory.
project:
  name: "potential_floodplain_delineation"

inputs:
  dem: "../../grupos/inpa/abiotic_data/amazon_basin/uhe2025/processed/fathomdem/amazon_basin_fathomdem_30m_cog/amazon_basin_fathomdem_30m_cog.tif"                 # single-band elevation raster with CRS and nodata
  pilot_area: "data/input/bacia_rio_xingu.gpkg" # polygon layer(s); multiple polygons are dissolved
  pilot_layer: null                   # optional GPKG layer name
  vertical_units: "meters"            # vertical unit of the DEM (documentation + HAND threshold unit)

processing:
  buffer_distance: 0               # context buffer around the pilot area
  buffer_units: "meters"              # "meters" or "cells"
  conditioning:
    method: "breach"                  # "breach" (BreachDepressions) or "fill" (FillDepressionsWangAndLiu)
  flow:
    algorithm: "d8"                   # only D8 is supported
  drainage:
    threshold_type: "area_km2"        # "cells" or "area_km2"
    threshold_value: 5000          # minimum contributing cells or km2 to define drainage
  hand:
    threshold: 1600                      # same vertical unit as the DEM

outputs:
  directory: "outputs"
  intermediates: "intermediate"
  final: "final"
  save_conditioned_dem: true
  save_flow_direction: true
  save_flow_accumulation: true
  save_drainage_network: true
  save_hand: true

execution:
  overwrite: false                  # true: start from scratch (excludes resume)
  resume: false                     # true: reuse up-to-date stages of a previous run (after a failure, or to change only the HAND/drainage threshold)
  verbose: true
  # max_procs: 18                   # passed to WhiteboxTools (--max_procs); most of its tools are single-threaded
  # heartbeat_seconds: 300          # progress message interval during long WhiteboxTools runs
  # whitebox_version: "2.4.0"       # require exactly this WhiteboxTools version
  # scratch_directory: "/tmp/fp_scratch"   # fast local disk for raw WhiteboxTools outputs
  # whitebox_executable: "/path/to/whitebox_tools"   # optional; auto-detected otherwise
