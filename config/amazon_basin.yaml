# Example configuration (illustrative values only -- NOT calibrated for any basin).
# Relative paths are resolved against the current working directory.
project:
  name: "potential_floodplain_delineation"

inputs:
  dem: "../../grupos/inpa/abiotic_data/amazon_basin/uhe2025/processed/fathomdem/amazon_basin_buffered_0_3_degrees_fathomdem_cog/amazon_basin_buffered_0_3_degrees_fathomdem_cog.tif"                 # single-band elevation raster with CRS and nodata
  pilot_area: "data/input/bacia_rio_xingu.gpkg" # polygon layer(s); multiple polygons are dissolved
  pilot_layer: null                   # optional GPKG layer name
  vertical_units: "meters"            # vertical unit of the DEM (documentation + HAND threshold unit)

processing:
  # All hydrological processing and the REM run on ONE grid in a projected CRS. The input DEM is reprojected
  # once (stage 0) -- unless it already is in this CRS at the requested resolution, then it is only cropped.
  crs: "ESRI:102033"                  # South America Albers Equal Area Conic (ESRI authority, NOT an EPSG code); default
  target_resolution: null             # CRS units (metres); null: derived from the source DEM by GDAL and recorded in the summary
  dem_resampling: "bilinear"          # near | bilinear | cubic | cubic_spline | lanczos (continuous elevation only)
  buffer_distance: 0                  # context buffer around the pilot area, in the processing CRS
  buffer_units: "meters"              # "meters" or "cells"
  conditioning:
    method: "breach_least_cost"       # "breach" | "fill" | "breach_least_cost" (BreachDepressionsLeastCost)
    breach_least_cost:                # required for breach_least_cost; illustrative values -- NOT calibrated
      max_distance_cells: 100         # --dist: maximum length of a breach path, in cells (required, no default)
      max_cost: null                  # --max_cost: maximum breach cost; null = tool default (unbounded)
      minimize_distance: true         # --min_dist: prefer shorter breach channels
      flat_increment: null            # --flat_increment: null = tool default
    fill_remaining: false             # true: after the breach, fill the depressions that are left
                                      # (second step: FillDepressionsWangAndLiu --fix_flats)
  flow:
    algorithm: "d8"                   # only D8 is supported
  drainage:
    threshold_type: "area_km2"        # "cells" or "area_km2"
    threshold_value: 20000            # minimum contributing cells or km2 to define drainage
  hand:
    threshold: 16                 # same vertical unit as the DEM
  rem:                                # Relative Elevation Model: DEM minus an IDW surface per stream-link basin
    enabled: true                     # false: HAND only (WhiteboxTools Subbasins is then never run)
    sampling_interval_pixels: 10      # one drainage sample per 10x10-pixel block and basin (1 = every drainage pixel)
    idw_power: 2.0                    # IDW exponent; all samples of a basin take part, no search radius

outputs:
  directory: "outputs"
  intermediates: "intermediate"
  final: "final"
  save_conditioned_dem: true
  save_flow_direction: true
  save_flow_accumulation: true
  save_drainage_network: true
  save_hand: true
  rem: "rem"                        # sub-directory of the REM products
  save_basins: true                 # basins.tif (stream-link basin IDs)
  save_rem_samples: true            # rem_samples.npz (sampled drainage pixels)
  save_rem_drainage_surface: true   # rem/rem_drainage_surface.tif (IDW surface)

execution:
  overwrite: false                  # true: start from scratch (excludes resume)
  resume: false                     # true: reuse up-to-date stages of a previous run (after a failure, or to change only the HAND/drainage threshold)
  verbose: true
  # max_procs: 18                   # passed to WhiteboxTools (--max_procs); most of its tools are single-threaded
  # heartbeat_seconds: 300          # progress message interval during long WhiteboxTools runs
  # whitebox_version: "2.4.0"       # require exactly this WhiteboxTools version
  # scratch_directory: "/tmp/fp_scratch"   # fast local disk for raw WhiteboxTools outputs
  # whitebox_executable: "/path/to/whitebox_tools"   # optional; auto-detected otherwise

